[project]
name = "aiida-reoptimize"
version = "0.8.6"
description = "Algorithms for external optimization of crystal structures"
authors = [{name = "Anton Domnin",email = "a.v.daomnin@gmail.com"},]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AiiDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
keywords = ["aiida", "plugin", "fleur", "crystal"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = [
    "pymoo>=0.6.1.6,<0.7",
    "aiida-core>=2.5,<3",
    "mpds_client",
    "ase",
    "spglib>=2.6.0",
    "ase-fleur @ git+https://github.com/JuDFTteam/ase-fleur",
    "aiida-fleur>=2.0.0",
    "aiida-crystal-dft @ git+https://github.com/tilde-lab/aiida-crystal-dft"
]

[project.urls]
Source = "https://github.com/mpds-io/aiida-reoptimize"

[project.entry-points."aiida.workflows"]
"reoptimize.AdamFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:AdamFleurRelaxOptimizer"
"reoptimize.RMSpropFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:RMSpropFleurRelaxOptimizer"
"reoptimize.BFGSFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:BFGSFleurRelaxOptimizer"
"reoptimize.PyMOOFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:PyMOOFleurRelaxOptimizer"
"reoptimize.G3PCXFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:G3PCXFleurRelaxOptimizer"
"reoptimize.NRBOFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:NRBOFleurRelaxOptimizer"
"reoptimize.CDGFleurRelaxOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurRelax:CDGFleurRelaxOptimizer"
"reoptimize.AdamFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:AdamFleurSCFOptimizer"
"reoptimize.RMSpropFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:RMSpropFleurSCFOptimizer"
"reoptimize.BFGSFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:BFGSFleurSCFOptimizer"
"reoptimize.PyMOOFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:PyMOOFleurSCFOptimizer"
"reoptimize.G3PCXFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:G3PCXFleurSCFOptimizer"
"reoptimize.NRBOFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:NRBOFleurSCFOptimizer"
"reoptimize.CDGFleurSCFOptimizer" = "aiida_reoptimize.workflows.Optimization.FleurSCF:CDGFleurSCFOptimizer"
"reoptimize.AdamCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:AdamCrystalOptimizer"
"reoptimize.CDGCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:CDGCrystalOptimizer"
"reoptimize.RMSpropCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:RMSpropCrystalOptimizer"
"reoptimize.BFGSCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:BFGSCrystalOptimizer"
"reoptimize.PyMOOCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:PyMOOCrystalOptimizer"
"reoptimize.G3PCXCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:G3PCXCrystalOptimizer"
"reoptimize.NRBOCrystalOptimizer" = "aiida_reoptimize.workflows.Optimization.Crystal:NRBOCrystalOptimizer"
"reoptimize.FleurSCFLatticeProblem" = "aiida_reoptimize.workflows.Evaluation.fleur_evaluators:FleurSCFLatticeProblem"
"reoptimize.FleurRelaxLatticeProblem" = "aiida_reoptimize.workflows.Evaluation.fleur_evaluators:FleurRelaxLatticeProblem"
"reoptimize.CrystalLatticeProblem" = "aiida_reoptimize.workflows.Evaluation.crystal_evaluation:CrystalLatticeProblem"

[dependency-groups]
dev = [
    "ruff>=0.6.9,<0.7",
]

[tool.uv]
default-groups = ["dev"]
